name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: esp-server/go.sum

      - name: Download dependencies
        working-directory: ./esp-server
        run: go mod download

      - name: Verify dependencies
        working-directory: ./esp-server
        run: go mod verify

      - name: Run go vet
        working-directory: ./esp-server
        run: go vet ./...

      - name: Run tests
        working-directory: ./esp-server
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./esp-server/coverage.txt
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: esp-server/go.sum

      - name: Build
        working-directory: ./esp-server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "Building for $GOOS/$GOARCH..."
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          mkdir -p "dist/$GOOS-$GOARCH"
          go build -v -ldflags="-s -w" -o "dist/$GOOS-$GOARCH/api-gateway$suffix" ./api-gateway
          go build -v -ldflags="-s -w" -o "dist/$GOOS-$GOARCH/auth-service$suffix" ./auth-service
          go build -v -ldflags="-s -w" -o "dist/$GOOS-$GOARCH/device-service$suffix" ./device-service
          go build -v -ldflags="-s -w" -o "dist/$GOOS-$GOARCH/mqtt-service$suffix" ./mqtt-service
          go build -v -ldflags="-s -w" -o "dist/$GOOS-$GOARCH/websocket-service$suffix" ./websocket-service

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: esp-server/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./esp-server
          args: --timeout=5m --disable=errcheck

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10 --activate

      - name: Get pnpm store path
        id: pnpm-store
        working-directory: ./esp-ui
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('esp-ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: ./esp-ui
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: ./esp-ui
        run: pnpm lint

      - name: Build frontend
        working-directory: ./esp-ui
        run: pnpm build

  firmware:
    name: Firmware (${{ matrix.env }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firmware/esp32-jgb37-drv8871-motor-controller
            env: esp32dev
          - project: firmware/esp32-epaper-display
            env: esp32dev-epaper-mono
          - project: firmware/esp32-epaper-display
            env: esp32dev-epaper-color

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ matrix.project }}-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
          restore-keys: |
            ${{ runner.os }}-platformio-${{ matrix.project }}-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -d "${{ matrix.project }}" -e "${{ matrix.env }}"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Gateway
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/Dockerfile.api-gateway
          push: false
          tags: esp-api-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Auth Service
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/Dockerfile.auth-service
          push: false
          tags: esp-auth-service:test

      - name: Build Device Service
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/Dockerfile.device-service
          push: false
          tags: esp-device-service:test

      - name: Build MQTT Service
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/Dockerfile.mqtt-service
          push: false
          tags: esp-mqtt-service:test

      - name: Build WebSocket Service
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/Dockerfile.websocket-service
          push: false
          tags: esp-websocket-service:test
