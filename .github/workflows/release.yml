name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        working-directory: ./go-services
        run: |
          # 創建輸出目錄
          mkdir -p ../dist
          
          # 構建 Linux AMD64
          echo "Building for Linux AMD64..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/api-gateway-linux-amd64 ./api-gateway
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/auth-service-linux-amd64 ./auth-service
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/device-service-linux-amd64 ./device-service
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mqtt-service-linux-amd64 ./mqtt-service
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/websocket-service-linux-amd64 ./websocket-service
          
          # 構建 Linux ARM64
          echo "Building for Linux ARM64..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/api-gateway-linux-arm64 ./api-gateway
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/auth-service-linux-arm64 ./auth-service
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/device-service-linux-arm64 ./device-service
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/mqtt-service-linux-arm64 ./mqtt-service
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/websocket-service-linux-arm64 ./websocket-service
          
          # 構建 macOS AMD64
          echo "Building for macOS AMD64..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/api-gateway-darwin-amd64 ./api-gateway
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/auth-service-darwin-amd64 ./auth-service
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/device-service-darwin-amd64 ./device-service
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mqtt-service-darwin-amd64 ./mqtt-service
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/websocket-service-darwin-amd64 ./websocket-service
          
          # 構建 macOS ARM64 (Apple Silicon)
          echo "Building for macOS ARM64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/api-gateway-darwin-arm64 ./api-gateway
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/auth-service-darwin-arm64 ./auth-service
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/device-service-darwin-arm64 ./device-service
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/mqtt-service-darwin-arm64 ./mqtt-service
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/websocket-service-darwin-arm64 ./websocket-service
          
          # 構建 Windows AMD64
          echo "Building for Windows AMD64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/api-gateway-windows-amd64.exe ./api-gateway
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/auth-service-windows-amd64.exe ./auth-service
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/device-service-windows-amd64.exe ./device-service
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mqtt-service-windows-amd64.exe ./mqtt-service
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/websocket-service-windows-amd64.exe ./websocket-service

      - name: Create archives
        run: |
          cd dist
          
          # Linux AMD64
          tar czf esp-platform-linux-amd64.tar.gz \
            api-gateway-linux-amd64 \
            auth-service-linux-amd64 \
            device-service-linux-amd64 \
            mqtt-service-linux-amd64 \
            websocket-service-linux-amd64
          
          # Linux ARM64
          tar czf esp-platform-linux-arm64.tar.gz \
            api-gateway-linux-arm64 \
            auth-service-linux-arm64 \
            device-service-linux-arm64 \
            mqtt-service-linux-arm64 \
            websocket-service-linux-arm64
          
          # macOS AMD64
          tar czf esp-platform-darwin-amd64.tar.gz \
            api-gateway-darwin-amd64 \
            auth-service-darwin-amd64 \
            device-service-darwin-amd64 \
            mqtt-service-darwin-amd64 \
            websocket-service-darwin-amd64
          
          # macOS ARM64
          tar czf esp-platform-darwin-arm64.tar.gz \
            api-gateway-darwin-arm64 \
            auth-service-darwin-arm64 \
            device-service-darwin-arm64 \
            mqtt-service-darwin-arm64 \
            websocket-service-darwin-arm64
          
          # Windows AMD64
          zip esp-platform-windows-amd64.zip \
            api-gateway-windows-amd64.exe \
            auth-service-windows-amd64.exe \
            device-service-windows-amd64.exe \
            mqtt-service-windows-amd64.exe \
            websocket-service-windows-amd64.exe
          
          # 生成 SHA256 校驗和
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          ## ESP 控制平台 Go 微服務架構 ${{ steps.get_version.outputs.VERSION }}
          
          ### 📦 下載
          
          選擇適合您系統的版本：
          
          - **Linux AMD64**: `esp-platform-linux-amd64.tar.gz`
          - **Linux ARM64**: `esp-platform-linux-arm64.tar.gz`
          - **macOS Intel**: `esp-platform-darwin-amd64.tar.gz`
          - **macOS Apple Silicon**: `esp-platform-darwin-arm64.tar.gz`
          - **Windows**: `esp-platform-windows-amd64.zip`
          
          ### ✨ 主要特性
          
          - 🚀 5 個微服務（API Gateway, Auth, Device, MQTT, WebSocket）
          - 📦 完整的 Docker 容器化部署
          - 📚 完整的文檔體系
          - 🔒 JWT 令牌認證
          - 🔄 完全向後兼容 Node.js 版本
          - ⚡ 性能提升 30-50%
          
          ### 📋 快速啟動
          
          #### 使用 Docker Compose（推薦）
          
          ```bash
          cd go-services
          cp .env.example .env
          # 編輯 .env 設置 JWT_SECRET 等
          docker compose up -d
          ```
          
          #### 使用二進制文件
          
          1. 下載適合您系統的壓縮包
          2. 解壓縮
          3. 設置環境變數
          4. 運行各個服務
          
          ```bash
          # Linux/macOS
          tar xzf esp-platform-linux-amd64.tar.gz
          export DATABASE_URL="postgresql://..."
          export JWT_SECRET="your-secret"
          ./api-gateway-linux-amd64
          
          # Windows
          unzip esp-platform-windows-amd64.zip
          set DATABASE_URL=postgresql://...
          set JWT_SECRET=your-secret
          api-gateway-windows-amd64.exe
          ```
          
          ### 📖 文檔
          
          - [README](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/go-services/README.md)
          - [快速啟動指南](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/go-services/QUICKSTART.md)
          - [部署指南](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/go-services/DEPLOYMENT.md)
          - [遷移指南](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/go-services/MIGRATION.md)
          
          ### 🔐 校驗和
          
          請使用 `checksums.txt` 文件驗證下載的完整性：
          
          ```bash
          sha256sum -c checksums.txt
          ```
          
          ### 📝 變更日誌
          
          詳細變更請查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/go-services/CHANGELOG.md)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          files: |
            dist/esp-platform-linux-amd64.tar.gz
            dist/esp-platform-linux-arm64.tar.gz
            dist/esp-platform-darwin-amd64.tar.gz
            dist/esp-platform-darwin-arm64.tar.gz
            dist/esp-platform-windows-amd64.zip
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
