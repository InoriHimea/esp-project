name: Docker Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/esp-platform

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: Dockerfile.api-gateway
          - name: auth-service
            dockerfile: Dockerfile.auth-service
          - name: device-service
            dockerfile: Dockerfile.device-service
          - name: mqtt-service
            dockerfile: Dockerfile.mqtt-service
          - name: websocket-service
            dockerfile: Dockerfile.websocket-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./esp-server
          file: ./esp-server/${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-manifest:
    name: Create Docker Compose Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: |
          release_version="${GITHUB_REF#refs/tags/}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${release_version#v}" >> "$GITHUB_OUTPUT"

      - name: Create deployment manifest
        run: |
          cp esp-server/mosquitto.conf mosquitto.conf
          cat > docker-compose.release.yml << EOF
          version: '3.8'
          
          services:
            postgres:
              image: postgres:18.3-alpine
              environment:
                POSTGRES_USER: esp_user
                POSTGRES_PASSWORD: \${POSTGRES_PASSWORD}
                POSTGRES_DB: esp_platform
              volumes:
                - postgres_data:/var/lib/postgresql/data
              networks:
                - esp-network
          
            mosquitto:
              image: eclipse-mosquitto:2.1.2-alpine
              ports:
                - "1883:1883"
                - "9001:9001"
              volumes:
                - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
                - mosquitto_data:/mosquitto/data
                - mosquitto_logs:/mosquitto/log
              networks:
                - esp-network
          
            api-gateway:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api-gateway:${{ steps.get_version.outputs.IMAGE_TAG }}
              ports:
                - "8080:8080"
              environment:
                PORT: 8080
                DATABASE_URL: \${DATABASE_URL}
                JWT_SECRET: \${JWT_SECRET}
                AUTH_SERVICE_URL: http://auth-service:8081
                DEVICE_SERVICE_URL: http://device-service:8082
                MQTT_SERVICE_URL: http://mqtt-service:8083
                WEBSOCKET_SERVICE_URL: http://websocket-service:8084
                INTERNAL_TOKEN: \${INTERNAL_TOKEN}
                CORS_ORIGINS: \${CORS_ORIGINS}
              depends_on:
                - postgres
                - auth-service
                - device-service
                - mqtt-service
                - websocket-service
              networks:
                - esp-network
          
            auth-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-auth-service:${{ steps.get_version.outputs.IMAGE_TAG }}
              environment:
                PORT: 8081
                DATABASE_URL: \${DATABASE_URL}
                JWT_SECRET: \${JWT_SECRET}
              depends_on:
                - postgres
              networks:
                - esp-network
          
            device-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-device-service:${{ steps.get_version.outputs.IMAGE_TAG }}
              environment:
                PORT: 8082
                DATABASE_URL: \${DATABASE_URL}
                MQTT_BROKER: tcp://mosquitto:1883
                MQTT_SERVICE_URL: http://mqtt-service:8083
                INTERNAL_TOKEN: \${INTERNAL_TOKEN}
              depends_on:
                - postgres
                - mosquitto
              networks:
                - esp-network
          
            mqtt-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-mqtt-service:${{ steps.get_version.outputs.IMAGE_TAG }}
              environment:
                PORT: 8083
                DATABASE_URL: \${DATABASE_URL}
                MQTT_BROKER: tcp://mosquitto:1883
                WEBSOCKET_SERVICE_URL: http://websocket-service:8084
                INTERNAL_TOKEN: \${INTERNAL_TOKEN}
              depends_on:
                - postgres
                - mosquitto
              networks:
                - esp-network
          
            websocket-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-websocket-service:${{ steps.get_version.outputs.IMAGE_TAG }}
              environment:
                PORT: 8084
                JWT_SECRET: \${JWT_SECRET}
                MQTT_BROKER: tcp://mosquitto:1883
                INTERNAL_TOKEN: \${INTERNAL_TOKEN}
              depends_on:
                - mosquitto
              networks:
                - esp-network
          
          networks:
            esp-network:
              driver: bridge
          
          volumes:
            postgres_data:
            mosquitto_data:
            mosquitto_logs:
          EOF

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-compose-manifest
          path: |
            docker-compose.release.yml
            mosquitto.conf
