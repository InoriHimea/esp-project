; ESP32 E-Paper Display Controller
; PlatformIO Project Configuration

[platformio]
default_envs = esp32dev-epaper-mono
data_dir = data

[env]
platform  = espressif32@^7.0.1
board     = esp32dev
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV
    -DEPD_BUSY=4
    -DEPD_RST=16
    -DEPD_DC=17
    -DEPD_CS=5
    -DEPD_SCK=18
    -DEPD_MOSI=23
    -DSTATUS_LED=2

upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

board_build.filesystem = littlefs

lib_deps =
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.0
    bblanchon/ArduinoJson @ ^7.4.3
    knolleary/PubSubClient @ ^2.8

[env:esp32dev-epaper-mono]
extends = env
build_flags =
    ${env.build_flags}
    -DEPAPER_PANEL_MONO
    -DEPAPER_PANEL_MODEL=\"waveshare_2in9_bw\"
    -DEPAPER_WIDTH=296
    -DEPAPER_HEIGHT=128
    -DEPAPER_PALETTE=\"white,black\"
    -DEPAPER_SUPPORTS_PARTIAL=1

[env:esp32dev-epaper-color]
extends = env
build_flags =
    ${env.build_flags}
    -DEPAPER_PANEL_COLOR
    -DEPAPER_PANEL_MODEL=\"waveshare_2in9_tri_color\"
    -DEPAPER_WIDTH=296
    -DEPAPER_HEIGHT=128
    -DEPAPER_ACCENT_COLOR=\"red\"
    -DEPAPER_PALETTE=\"white,black,red\"
    -DEPAPER_SUPPORTS_PARTIAL=0
