; ESP32 Motor Controller - JGB37-520 + DRV8871
; PlatformIO Project Configuration

[platformio]
data_dir = data

[env:esp32dev]
platform  = espressif32@^7.0.1
board     = esp32dev
framework = arduino

; ─── Build ──────────────────────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV

; ─── Upload ─────────────────────────────────────────────────────────────────
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; ─── LittleFS ────────────────────────────────────────────────────────────────
board_build.filesystem = littlefs

; ─── Dependencies ────────────────────────────────────────────────────────────
lib_deps =
    ; Async HTTP + WebSocket server (no blocking, event-driven)
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.10
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.11.0
    ; JSON serialization / deserialization
    bblanchon/ArduinoJson @ ^7.4.3
    ; MQTT client
    knolleary/PubSubClient @ ^2.8
    ; 直驱数码管无需外部库，Arduino GPIO API 即可
