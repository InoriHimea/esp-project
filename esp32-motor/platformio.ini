; ESP32 Motor Controller - JGB37-520 + DRV8871
; PlatformIO Project Configuration

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; ─── Build ──────────────────────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_ESP32_DEV

; ─── Upload ─────────────────────────────────────────────────────────────────
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters = esp32_exception_decoder

; ─── LittleFS ────────────────────────────────────────────────────────────────
board_build.filesystem = littlefs
data_dir               = data

; ─── Dependencies ────────────────────────────────────────────────────────────
lib_deps =
    ; Async HTTP + WebSocket server (no blocking, event-driven)
    https://github.com/me-no-dev/AsyncTCP#master
    https://github.com/me-no-dev/ESPAsyncWebServer#master
    ; JSON serialization / deserialization
    bblanchon/ArduinoJson @ ^7.1.0
    ; Persistent config storage
    ESP32 Preferences
    ; MQTT client
    knolleary/PubSubClient @ ^2.8
    ; 直驱数码管无需外部库，Arduino GPIO API 即可
